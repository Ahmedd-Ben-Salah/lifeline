<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#1a0f0c"/>
    </linearGradient>
    <radialGradient id="mars" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f0a070"/>
      <stop offset="0.55" stop-color="#c1532b"/>
      <stop offset="1" stop-color="#5a1d0e"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fa3c7"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <circle cx="90" cy="70" r="1.2" fill="#fff" opacity="0.6"/>
  <circle cx="420" cy="40" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="760" cy="62" r="1.3" fill="#fff" opacity="0.5"/>
  <circle cx="980" cy="28" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="620" cy="100" r="0.9" fill="#fff" opacity="0.4"/>
  <circle cx="1210" cy="150" r="1.1" fill="#fff" opacity="0.5"/>
  <circle cx="1150" cy="72" r="46" fill="url(#mars)"/>
  <ellipse cx="1150" cy="72" rx="70" ry="16" fill="none" stroke="#e8935f" stroke-opacity="0.35" stroke-dasharray="3 5"/>

  <text x="48" y="66" fill="#ffffff" font-size="40" font-weight="800" letter-spacing="6">LIFELINE</text>
  <text x="48" y="96" fill="#e8935f" font-size="18" font-weight="600">The supply chain between worlds</text>
  <text x="48" y="122" fill="#8fa3c7" font-size="14">Forecast danger on Mars · coordinate colonies · plan the Earth delivery before anyone runs out</text>
  <text x="1075" y="150" fill="#8fa3c7" font-size="12" text-anchor="middle">Beyond 2030 · IEEE Lumen 2.0</text>

  <g font-size="13">
    <text x="48" y="168" fill="#8fa3c7" font-size="11" font-weight="700" letter-spacing="2">PEOPLE</text>
    <rect x="48" y="176" width="284" height="40" rx="8" fill="#141b2d" stroke="#2a3654"/>
    <text x="190" y="201" fill="#e6ecf7" text-anchor="middle">Colony operators (Mars)</text>
    <rect x="346" y="176" width="284" height="40" rx="8" fill="#141b2d" stroke="#2a3654"/>
    <text x="488" y="201" fill="#e6ecf7" text-anchor="middle">Earth mission control</text>
    <rect x="644" y="176" width="284" height="40" rx="8" fill="#141b2d" stroke="#2a3654"/>
    <text x="786" y="201" fill="#e6ecf7" text-anchor="middle">Launch &amp; cargo suppliers</text>
    <rect x="942" y="176" width="290" height="40" rx="8" fill="#141b2d" stroke="#2a3654"/>
    <text x="1087" y="201" fill="#e6ecf7" text-anchor="middle">Viewers (read-only)</text>

    <line x1="640" y1="218" x2="640" y2="240" stroke="#8fa3c7" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="48" y="238" fill="#8fa3c7" font-size="11" font-weight="700" letter-spacing="2">CLIENT</text>
    <rect x="48" y="246" width="1184" height="52" rx="10" fill="#16213a" stroke="#3a5a9a"/>
    <text x="640" y="268" fill="#ffffff" text-anchor="middle" font-weight="700">Next.js + React pages · three.js 3D Mars globe, storm cone, Earth–Mars orbit view</text>
    <text x="640" y="288" fill="#a9b8d6" text-anchor="middle" font-size="12">Overview · Forecasts · Comms · Logistics · Resupply · Traffic 3D · Automations · Policies — polls /api/state every 1.5 s</text>

    <line x1="640" y1="300" x2="640" y2="320" stroke="#8fa3c7" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="48" y="318" fill="#8fa3c7" font-size="11" font-weight="700" letter-spacing="2">API</text>
    <rect x="48" y="326" width="1184" height="44" rx="10" fill="#16213a" stroke="#3a5a9a"/>
    <text x="640" y="353" fill="#ffffff" text-anchor="middle" font-weight="600">Route handlers (app/api) · signed JWT session cookie · role matrix checked on every call · audit log</text>

    <line x1="330" y1="372" x2="330" y2="398" stroke="#8fa3c7" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="950" y1="372" x2="950" y2="398" stroke="#8fa3c7" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="48" y="396" fill="#8fa3c7" font-size="11" font-weight="700" letter-spacing="2">AGENTS</text>
    <rect x="48" y="404" width="560" height="176" rx="12" fill="#1d1630" stroke="#7a5cc4"/>
    <text x="328" y="430" fill="#ffffff" text-anchor="middle" font-weight="700" font-size="15">Agents explain · they never compute</text>
    <text x="68" y="456" fill="#d7ccf5">Weather · Colony ×4 · Logistics · Earth supply</text>
    <text x="68" y="478" fill="#d7ccf5">Protocol: WARN · NEED · OFFER · ACCEPT · TIMEOUT · ORDER · FAULT</text>
    <text x="68" y="500" fill="#d7ccf5">LLM with tool use · every message HMAC-signed</text>
    <text x="68" y="526" fill="#f0c36a" font-weight="600">Guardrails</text>
    <text x="68" y="546" fill="#d7ccf5" font-size="12">number grounding · timeouts · scripted fallback</text>
    <text x="68" y="566" fill="#d7ccf5" font-size="12">Earth orders need two human approvals</text>

    <line x1="612" y1="492" x2="666" y2="492" stroke="#f0c36a" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <text x="639" y="482" fill="#f0c36a" text-anchor="middle" font-size="11" font-weight="700">tools</text>

    <text x="672" y="396" fill="#8fa3c7" font-size="11" font-weight="700" letter-spacing="2">ENGINE · DETERMINISTIC</text>
    <rect x="672" y="404" width="560" height="176" rx="12" fill="#2a160f" stroke="#c1532b"/>
    <g font-size="12">
      <rect x="688" y="420" width="168" height="44" rx="7" fill="#3a1e14" stroke="#7a3a22"/>
      <text x="772" y="439" fill="#fff" text-anchor="middle" font-weight="600">Storm ensemble</text>
      <text x="772" y="455" fill="#f0b896" text-anchor="middle" font-size="11">300 seeded runs · cone</text>
      <rect x="868" y="420" width="168" height="44" rx="7" fill="#3a1e14" stroke="#7a3a22"/>
      <text x="952" y="439" fill="#fff" text-anchor="middle" font-weight="600">Resource model</text>
      <text x="952" y="455" fill="#f0b896" text-anchor="middle" font-size="11">Monte-Carlo stocks</text>
      <rect x="1048" y="420" width="168" height="44" rx="7" fill="#3a1e14" stroke="#7a3a22"/>
      <text x="1132" y="439" fill="#fff" text-anchor="middle" font-weight="600">Rover router</text>
      <text x="1132" y="455" fill="#f0b896" text-anchor="middle" font-size="11">A* on MOLA terrain</text>
      <rect x="688" y="474" width="168" height="44" rx="7" fill="#3a1e14" stroke="#7a3a22"/>
      <text x="772" y="493" fill="#fff" text-anchor="middle" font-weight="600">Lambert solver</text>
      <text x="772" y="509" fill="#f0b896" text-anchor="middle" font-size="11">windows · porkchop</text>
      <rect x="868" y="474" width="168" height="44" rx="7" fill="#3a1e14" stroke="#7a3a22"/>
      <text x="952" y="493" fill="#fff" text-anchor="middle" font-weight="600">Cargo packer</text>
      <text x="952" y="509" fill="#f0b896" text-anchor="middle" font-size="11">life-critical first</text>
      <rect x="1048" y="474" width="168" height="44" rx="7" fill="#3a1e14" stroke="#7a3a22"/>
      <text x="1132" y="493" fill="#fff" text-anchor="middle" font-weight="600">Landing scorer</text>
      <text x="1132" y="509" fill="#f0b896" text-anchor="middle" font-size="11">slope · quakes · dust</text>
      <rect x="688" y="528" width="528" height="40" rx="7" fill="#3a1e14" stroke="#7a3a22"/>
      <text x="952" y="553" fill="#fff" text-anchor="middle" font-weight="600">Ephemeris · light delay · Mars season (Ls) · sol clock · season outlook</text>
    </g>

    <line x1="640" y1="584" x2="640" y2="606" stroke="#8fa3c7" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="48" y="604" fill="#8fa3c7" font-size="11" font-weight="700" letter-spacing="2">STATE</text>
    <rect x="48" y="612" width="1184" height="44" rx="10" fill="#122a24" stroke="#2f8a6e"/>
    <text x="640" y="639" fill="#ffffff" text-anchor="middle" font-weight="600">World store: one JSON document (Redis / local file) · tick(now) applies scheduled events · light-delayed delivery</text>

    <text x="48" y="684" fill="#8fa3c7" font-size="11" font-weight="700" letter-spacing="2">REAL DATA</text>
    <g font-size="12">
      <rect x="48" y="692" width="224" height="36" rx="18" fill="#141b2d" stroke="#2a3654"/>
      <text x="160" y="715" fill="#e6ecf7" text-anchor="middle">JPL planetary elements</text>
      <rect x="288" y="692" width="224" height="36" rx="18" fill="#141b2d" stroke="#2a3654"/>
      <text x="400" y="715" fill="#e6ecf7" text-anchor="middle">NASA MOLA elevation</text>
      <rect x="528" y="692" width="224" height="36" rx="18" fill="#141b2d" stroke="#2a3654"/>
      <text x="640" y="715" fill="#e6ecf7" text-anchor="middle">NASA BVAD crew needs</text>
      <rect x="768" y="692" width="224" height="36" rx="18" fill="#141b2d" stroke="#2a3654"/>
      <text x="880" y="715" fill="#e6ecf7" text-anchor="middle">Opportunity 2018 dust storm</text>
      <rect x="1008" y="692" width="224" height="36" rx="18" fill="#141b2d" stroke="#2a3654"/>
      <text x="1120" y="715" fill="#e6ecf7" text-anchor="middle">Mars global storm record</text>
    </g>
  </g>
